name: Add a repo
description: Suggest an open-source tool that manages agent skills
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of tool is it?
      options:
        - All-in-one
        - CLI installers
        - Sync across agents
        - Apps & GUIs
        - Registries & marketplaces
        - Teams
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything the README does not say
      description: Optional. The review reads the README, so the best way to get listed is a README that shows it working.
